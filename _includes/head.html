{% comment %}Local override: keep fonts and styles first-party, without the theme's mutable icon CDN.{% endcomment %}
<meta charset="utf-8">
{% include seo.html %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
{% unless site.atom_feed.hide %}
  <link href="{{ site.atom_feed.path | default: '/feed.xml' | relative_url }}" type="application/atom+xml" rel="alternate" title="{{ site.title | escape }} — Flux RSS">
{% endunless %}
<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
{% if site.head_scripts %}
  {% for script in site.head_scripts %}
    <script src="{{ script | relative_url }}"></script>
  {% endfor %}
{% endif %}
